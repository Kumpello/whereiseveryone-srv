---
version: "2"
run:
  timeout: 10m

formatters:
  enable:
    - gofmt

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - dupl
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    # TODO: decide about import order and enable the linter
    # - gci
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - gomoddirectives
    - goprintffuncname
    - gosec
    # Not full go1.18 support, disable for a while
    # - ireturn
    - lll
    - makezero
    - misspell
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - predeclared
    - promlinter
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tagliatelle
    - thelper
    - unconvert
    - unparam
    - wastedassign
    - wrapcheck
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - errcheck
          - forcetypeassert
          - funlen
          - gochecknoglobals
          - gochecknoinits
          - goconst
          - gocyclo
          - err113
          - ireturn
          - lll

  settings:
    nolintlint:
      require-explanation: true
      require-specific: true

    errcheck:
      check-blank: true

    govet:
      enable:
        - shadow

    nakedret:
      max-func-lines: 0

    tagliatelle:
      case:
        rules:
          json: snake
          bson: snake

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - multierr.Append(
        - multierr.Combine(
        - (*whereiseveryone/internal/webapi/jsonerr.JSONError).Echo(
        - endpoints.
        - (*github.com/labstack/echo/v5.Context).JSON(
        - (*github.com/labstack/echo/v5.Context).String(
        - (*github.com/labstack/echo/v5.Context).NoContent(

    revive:
      confidence: 0.8
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
