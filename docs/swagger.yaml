basePath: /
definitions:
  auth.authResponse:
    properties:
      id:
        description: ID is user id (uuid)
        type: string
      refresh_token:
        description: RefreshToken refresh-only token for /auth/refresh; cannot be
          used as a Bearer token
        type: string
      token:
        description: Token access token for Bearer authentication; must match the
          current stored session
        type: string
    type: object
  auth.logInRequest:
    properties:
      device_token:
        description: DeviceToken identifies the client device for single-device auth
        type: string
      password:
        description: Password user password
        type: string
      username:
        description: Username
        type: string
    required:
    - password
    - username
    type: object
  auth.refreshTokenRequest:
    properties:
      device_token:
        description: DeviceToken identifies the client device requesting refresh
        type: string
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.signUpRequest:
    properties:
      device_token:
        description: DeviceToken identifies the client device for single-device auth
        type: string
      password:
        description: Password user password, min 8 characters
        minLength: 8
        type: string
      username:
        description: Username username, must be unique
        type: string
    required:
    - password
    - username
    type: object
  jsonerr.JSONError:
    properties:
      code:
        description: Code is desired http code for this error
        type: integer
      error:
        description: |-
          Err is a golang error returned by the app
          It is removed in production application (TBD)
        type: string
      message:
        description: Message is human friendly error message
        type: string
    type: object
  me.friendDetails:
    properties:
      friend_since:
        type: string
      location:
        $ref: '#/definitions/me.locationDetails'
      state:
        $ref: '#/definitions/me.friendState'
      status:
        type: string
      username:
        type: string
    type: object
  me.friendRequest:
    properties:
      username:
        type: string
    type: object
  me.friendState:
    enum:
    - accepted
    - pending_incoming
    - pending_outgoing
    type: string
    x-enum-varnames:
    - friendStateAccepted
    - friendStatePendingIncoming
    - friendStatePendingOutgoing
  me.locationDetails:
    properties:
      accuracy:
        type: number
      altitude:
        type: number
      bearing:
        type: number
      last_update:
        description: LastUpdate in UTC time
        type: string
      latitude:
        type: number
      longitude:
        type: number
      speed:
        type: number
    type: object
  me.pausedFriendDetails:
    properties:
      username:
        type: string
    type: object
  me.updateLocationRequest:
    properties:
      accuracy:
        type: number
      altitude:
        type: number
      bearing:
        type: number
      last_update:
        description: LastUpdate in UTC time
        type: string
      latitude:
        type: number
      longitude:
        type: number
      speed:
        type: number
    type: object
  me.updateStatusRequest:
    properties:
      status:
        type: string
    type: object
info:
  contact: {}
  description: This is a sample server for WhereIsEveryone
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: WhereIsEveryone
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: logs in as an exiting users using login and passowrd
      parameters:
      - description: login details
        in: body
        name: userDetails
        required: true
        schema:
          $ref: '#/definitions/auth.logInRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.authResponse'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "403":
          description: forbidden (invalid password)
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "404":
          description: user not exists
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: log in
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: requires the current refresh-purpose token; replaces both tokens
        and revokes previous access tokens
      parameters:
      - description: refresh token
        in: body
        name: refresh
        required: true
        schema:
          $ref: '#/definitions/auth.refreshTokenRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.authResponse'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: expired refresh token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "403":
          description: invalid refresh token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "404":
          description: user not exists
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: refresh auth tokens
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: creates a new user
      parameters:
      - description: sign up details
        in: body
        name: userDetails
        required: true
        schema:
          $ref: '#/definitions/auth.signUpRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.authResponse'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "409":
          description: conflict (user with such a name exists)
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: sign up as a new user
      tags:
      - auth
  /me/friend:
    delete:
      consumes:
      - application/json
      description: removes friend and clears pending requests between users
      parameters:
      - description: user to unfriend
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/me.friendRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "404":
          description: requested user not exists
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: remove friend
      tags:
      - me
    post:
      consumes:
      - application/json
      description: sends friend request to another user
      parameters:
      - description: user to friend
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/me.friendRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "404":
          description: requested user not exists
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: send friend request
      tags:
      - me
  /me/friend/accept:
    post:
      consumes:
      - application/json
      description: accepts pending friend request from another user
      parameters:
      - description: user to accept
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/me.friendRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "404":
          description: requested user not exists
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: accept friend request
      tags:
      - me
  /me/friend/reject:
    post:
      consumes:
      - application/json
      description: rejects pending friend request from another user
      parameters:
      - description: user to reject
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/me.friendRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "404":
          description: requested user not exists
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: reject friend request
      tags:
      - me
  /me/friends:
    get:
      description: returns accepted friends and pending friend requests
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/me.friendDetails'
            type: array
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: get friends details
      tags:
      - me
  /me/location:
    delete:
      description: nullify logged user location
      responses:
        "204":
          description: No Content
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: wipe location
      tags:
      - me
    put:
      consumes:
      - application/json
      description: update logged user location
      parameters:
      - description: update location object
        in: body
        name: location
        required: true
        schema:
          $ref: '#/definitions/me.updateLocationRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: update location
      tags:
      - me
  /me/sharing:
    get:
      description: returns list of friends with whom location sharing is paused
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/me.pausedFriendDetails'
            type: array
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: get paused friends details
      tags:
      - me
  /me/sharing/resume:
    post:
      consumes:
      - application/json
      description: resume sharing location with another user
      parameters:
      - description: user to resume sharing with
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/me.friendRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: resume sharing location
      tags:
      - me
  /me/sharing/stop:
    post:
      consumes:
      - application/json
      description: stop sharing location with another user
      parameters:
      - description: user to stop sharing with
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/me.friendRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: stop sharing location
      tags:
      - me
  /me/status:
    put:
      consumes:
      - application/json
      description: updates logged user status (text status)
      parameters:
      - description: update status object
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/me.updateStatusRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: update status
      tags:
      - me
securityDefinitions:
  Bearer:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
