basePath: /
definitions:
  auth.authResponse:
    properties:
      id:
        description: ID is the user's MongoDB ObjectID
        type: string
      refresh_token:
        description: RefreshToken is used only by /auth/refresh, not Bearer authentication
        type: string
      token:
        description: Token is the current access token for Bearer authentication
        type: string
    type: object
  auth.logInRequest:
    properties:
      device_token:
        description: DeviceToken is a nonblank device identifier of at most 256 characters
        maxLength: 256
        type: string
      password:
        description: Password is at most 72 bytes
        maxLength: 72
        type: string
      username:
        description: Username is at most 64 characters
        maxLength: 64
        type: string
    required:
    - device_token
    - password
    - username
    type: object
  auth.refreshTokenRequest:
    properties:
      device_token:
        description: DeviceToken must match the session device; at most 256 characters
        maxLength: 256
        type: string
      refresh_token:
        description: RefreshToken is an encoded JWT of at most 4096 bytes
        maxLength: 4096
        type: string
    required:
    - device_token
    - refresh_token
    type: object
  auth.restoreAuthResponse:
    properties:
      id:
        description: ID is the user's MongoDB ObjectID
        type: string
      refresh_token:
        description: RefreshToken is used only by /auth/refresh, not Bearer authentication
        type: string
      token:
        description: Token is the current access token for Bearer authentication
        type: string
      username:
        type: string
    type: object
  auth.restoreFinishRequest:
    properties:
      app_id:
        maxLength: 256
        type: string
      challenge_id:
        maxLength: 128
        type: string
      credential_json:
        maxLength: 12288
        type: string
      device_token:
        maxLength: 256
        type: string
    required:
    - app_id
    - challenge_id
    - credential_json
    - device_token
    type: object
  auth.restoreOptionsRequest:
    properties:
      app_id:
        maxLength: 256
        type: string
      device_token:
        maxLength: 256
        type: string
    required:
    - app_id
    - device_token
    type: object
  auth.signUpRequest:
    properties:
      device_token:
        description: DeviceToken is a nonblank device identifier of at most 256 characters
        maxLength: 256
        type: string
      password:
        description: Password is at least 8 characters and at most 72 bytes
        maxLength: 72
        minLength: 8
        type: string
      username:
        description: Username must be unique and at most 64 characters
        maxLength: 64
        type: string
    required:
    - device_token
    - password
    - username
    type: object
  jsonerr.JSONError:
    properties:
      code:
        description: Code is desired http code for this error
        type: integer
      correlation_id:
        description: CorrelationID identifies the request in server logs and the X-Request-ID
          header.
        type: string
      message:
        description: Message is human friendly error message
        type: string
    type: object
  me.friendDetails:
    properties:
      friend_since:
        type: string
      location:
        $ref: '#/definitions/me.locationDetails'
      points_of_interest:
        items:
          $ref: '#/definitions/me.pointOfInterestDetail'
        type: array
      state:
        $ref: '#/definitions/me.friendState'
      status:
        description: Status is present only for accepted friends, even when empty.
        type: string
      username:
        type: string
    type: object
  me.friendRequest:
    properties:
      username:
        description: Username is at most 64 characters.
        maxLength: 64
        type: string
    type: object
  me.friendState:
    enum:
    - accepted
    - pending_incoming
    - pending_outgoing
    type: string
    x-enum-varnames:
    - friendStateAccepted
    - friendStatePendingIncoming
    - friendStatePendingOutgoing
  me.getFriendsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/me.friendDetails'
        type: array
      next_cursor:
        type: string
    type: object
  me.locationDetails:
    properties:
      accuracy:
        type: number
      altitude:
        type: number
      bearing:
        description: GPS course in degrees; null is unavailable, 0 is north.
        type: number
        x-nullable: true
      car_mode:
        description: CarMode indicates that the user enabled car mode.
        type: boolean
      last_update:
        description: LastUpdate is the location fix time in Unix milliseconds (UTC).
        format: int64
        type: integer
      latitude:
        type: number
      longitude:
        type: number
      speed:
        description: Speed in m/s; null means unavailable, zero means stationary.
        type: number
        x-nullable: true
    required:
    - last_update
    type: object
  me.pausedFriendDetails:
    properties:
      username:
        type: string
    type: object
  me.pointOfInterestDetail:
    properties:
      created_at:
        format: int64
        type: integer
      creator_username:
        type: string
      description:
        type: string
      id:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
    type: object
  me.pointOfInterestRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      latitude:
        maximum: 90
        minimum: -90
        type: number
      longitude:
        maximum: 180
        minimum: -180
        type: number
      name:
        maxLength: 64
        type: string
    required:
    - latitude
    - longitude
    - name
    type: object
  me.updateLocationRequest:
    properties:
      accuracy:
        type: number
      altitude:
        type: number
      bearing:
        description: GPS course in degrees; null is unavailable, 0 is north.
        type: number
        x-nullable: true
      car_mode:
        description: CarMode indicates that the user enabled car mode.
        type: boolean
      last_update:
        description: LastUpdate is the location fix time in Unix milliseconds (UTC).
        format: int64
        type: integer
      latitude:
        type: number
      longitude:
        type: number
      speed:
        description: Speed in m/s; null means unavailable, zero means stationary.
        type: number
        x-nullable: true
    required:
    - last_update
    type: object
  me.updateStatusRequest:
    properties:
      status:
        description: Status is at most 1024 characters; an empty string clears the
          status.
        maxLength: 1024
        type: string
    type: object
  restore.Options:
    properties:
      challenge_id:
        type: string
      request_json:
        type: string
    type: object
info:
  contact: {}
  description: 'Bodies: max 16 KiB (413), application/json (415). Auth/me busy: 503
    with Retry-After: 1.'
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: WhereIsEveryone
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: invalid usernames and passwords return the same 403 response after
        bcrypt verification
      parameters:
      - description: login details
        in: body
        name: userDetails
        required: true
        schema:
          $ref: '#/definitions/auth.logInRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.authResponse'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "403":
          description: forbidden (invalid credentials)
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "409":
          description: device token conflict; session revoked, log in again
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: request body exceeds 16 KiB
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: content type must be application/json
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "429":
          description: too many requests; see Retry-After
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "503":
          description: server busy; retry after Retry-After seconds
          headers:
            Retry-After:
              description: Minimum delay in seconds before retrying (1)
              type: string
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: log in
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: atomically consumes the current refresh-purpose token for the bound
        device; refresh reuse is rejected immediately; the previous access token remains
        valid for up to 120 seconds, subject to its expiration
      parameters:
      - description: refresh token
        in: body
        name: refresh
        required: true
        schema:
          $ref: '#/definitions/auth.refreshTokenRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.authResponse'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: expired refresh token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "403":
          description: invalid refresh token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "404":
          description: user not exists
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "409":
          description: device token conflict; session revoked, log in again
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: request body exceeds 16 KiB
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: content type must be application/json
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "503":
          description: server busy; retry after Retry-After seconds
          headers:
            Retry-After:
              description: Minimum delay in seconds before retrying (1)
              type: string
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: refresh auth tokens
      tags:
      - auth
  /auth/restore/login/finish:
    post:
      consumes:
      - application/json
      description: Verify a silent restore assertion and move the session to the new
        device.
      parameters:
      - description: authentication assertion
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.restoreFinishRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.restoreAuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: sign in with a transferred Android restore key
      tags:
      - auth
  /auth/restore/login/options:
    post:
      consumes:
      - application/json
      description: Issue a five-minute one-use challenge for restore sign-in.
      parameters:
      - description: application and destination device
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.restoreOptionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/restore.Options'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: create Android restore-key authentication options
      tags:
      - auth
  /auth/restore/register/finish:
    post:
      consumes:
      - application/json
      description: Validate and persist an account-owned Android restore key.
      parameters:
      - description: registration response
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.restoreFinishRequest'
      responses:
        "204":
          description: registered
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      security:
      - Bearer: []
      summary: verify and save a system-managed Android restore key
      tags:
      - auth
  /auth/restore/register/options:
    post:
      consumes:
      - application/json
      description: Create account-bound options to enroll an Android restore key.
      parameters:
      - description: application and source device
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.restoreOptionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/restore.Options'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      security:
      - Bearer: []
      summary: create Android restore-key registration options
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: creates a new user
      parameters:
      - description: sign up details
        in: body
        name: userDetails
        required: true
        schema:
          $ref: '#/definitions/auth.signUpRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.authResponse'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "409":
          description: conflict (user with such a name exists)
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "413":
          description: request body exceeds 16 KiB
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: content type must be application/json
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "429":
          description: too many requests; see Retry-After
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "503":
          description: server busy; retry after Retry-After seconds
          headers:
            Retry-After:
              description: Minimum delay in seconds before retrying (1)
              type: string
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: sign up as a new user
      tags:
      - auth
  /me/friend:
    delete:
      consumes:
      - application/json
      description: removes friend and clears pending requests between users
      parameters:
      - description: user to unfriend
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/me.friendRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "404":
          description: requested user not exists
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "413":
          description: request body exceeds 16 KiB
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: content type must be application/json
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "503":
          description: server busy; retry after Retry-After seconds
          headers:
            Retry-After:
              description: Minimum delay in seconds before retrying (1)
              type: string
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: remove friend
      tags:
      - me
    post:
      consumes:
      - application/json
      description: sends friend request to another user
      parameters:
      - description: user to friend
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/me.friendRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "404":
          description: requested user not exists
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "409":
          description: friend or pending request limit reached
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "413":
          description: request body exceeds 16 KiB
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: content type must be application/json
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "503":
          description: server busy; retry after Retry-After seconds
          headers:
            Retry-After:
              description: Minimum delay in seconds before retrying (1)
              type: string
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: send friend request
      tags:
      - me
  /me/friend/accept:
    post:
      consumes:
      - application/json
      description: accepts pending friend request from another user
      parameters:
      - description: user to accept
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/me.friendRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/me.friendDetails'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "404":
          description: requested user not exists
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "409":
          description: friend or pending request limit reached
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "413":
          description: request body exceeds 16 KiB
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: content type must be application/json
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "503":
          description: server busy; retry after Retry-After seconds
          headers:
            Retry-After:
              description: Minimum delay in seconds before retrying (1)
              type: string
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: accept friend request
      tags:
      - me
  /me/friend/reject:
    post:
      consumes:
      - application/json
      description: rejects pending friend request from another user
      parameters:
      - description: user to reject
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/me.friendRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "404":
          description: requested user not exists
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "413":
          description: request body exceeds 16 KiB
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: content type must be application/json
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "503":
          description: server busy; retry after Retry-After seconds
          headers:
            Retry-After:
              description: Minimum delay in seconds before retrying (1)
              type: string
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: reject friend request
      tags:
      - me
  /me/friends:
    get:
      description: One bounded relationship page. Pending entries omit status and
        location.
      parameters:
      - default: accepted
        description: list
        enum:
        - accepted
        - pending_incoming
        - pending_outgoing
        in: query
        name: state
        type: string
      - default: 50
        description: page size
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: opaque next_cursor from the preceding page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/me.getFriendsResponse'
        "400":
          description: invalid pagination parameters
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "503":
          description: server busy; retry after Retry-After seconds
          headers:
            Retry-After:
              description: Minimum delay in seconds before retrying (1)
              type: string
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: get friends details
      tags:
      - me
  /me/location:
    delete:
      description: nullify logged user location
      responses:
        "204":
          description: No Content
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "503":
          description: server busy; retry after Retry-After seconds
          headers:
            Retry-After:
              description: Minimum delay in seconds before retrying (1)
              type: string
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: wipe location
      tags:
      - me
    put:
      consumes:
      - application/json
      description: 'Unix-ms fix time: max age 24h, future skew 5m (capped); older/duplicate
        fixes ignored.'
      parameters:
      - description: update location object
        in: body
        name: location
        required: true
        schema:
          $ref: '#/definitions/me.updateLocationRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
