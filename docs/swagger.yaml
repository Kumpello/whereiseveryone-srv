basePath: /
definitions:
  auth.authResponse:
    properties:
      id:
        description: ID is user id (uuid)
        type: string
      refresh_token:
        description: RefreshToken refresh-only token for /auth/refresh; cannot be
          used as a Bearer token
        type: string
      token:
        description: Token access token for Bearer authentication; must match the
          current stored session
        type: string
    type: object
  auth.logInRequest:
    properties:
      device_token:
        description: DeviceToken is a nonblank device identifier of at most 256 characters
        maxLength: 256
        type: string
      password:
        description: Password is at most 72 bytes
        maxLength: 72
        type: string
      username:
        description: Username is at most 64 characters
        maxLength: 64
        type: string
    required:
    - device_token
    - password
    - username
    type: object
  auth.refreshTokenRequest:
    properties:
      device_token:
        description: DeviceToken must match the session device; at most 256 characters
        maxLength: 256
        type: string
      refresh_token:
        description: RefreshToken is an encoded JWT of at most 4096 bytes
        maxLength: 4096
        type: string
    required:
    - device_token
    - refresh_token
    type: object
  auth.signUpRequest:
    properties:
      device_token:
        description: DeviceToken is a nonblank device identifier of at most 256 characters
        maxLength: 256
        type: string
      password:
        description: Password is at least 8 characters and at most 72 bytes
        maxLength: 72
        minLength: 8
        type: string
      username:
        description: Username must be unique and at most 64 characters
        maxLength: 64
        type: string
    required:
    - device_token
    - password
    - username
    type: object
  jsonerr.JSONError:
    properties:
      code:
        description: Code is desired http code for this error
        type: integer
      correlation_id:
        description: CorrelationID identifies the request in server logs and the X-Request-ID
          header.
        type: string
      message:
        description: Message is human friendly error message
        type: string
    type: object
  me.friendDetails:
    properties:
      friend_since:
        type: string
      location:
        $ref: '#/definitions/me.locationDetails'
      state:
        $ref: '#/definitions/me.friendState'
      status:
        description: Status is present only for accepted friends, even when empty.
        type: string
      username:
        type: string
    type: object
  me.friendRequest:
    properties:
      username:
        description: Username is at most 64 characters.
        maxLength: 64
        type: string
    type: object
  me.friendState:
    enum:
    - accepted
    - pending_incoming
    - pending_outgoing
    type: string
    x-enum-varnames:
    - friendStateAccepted
    - friendStatePendingIncoming
    - friendStatePendingOutgoing
  me.getFriendsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/me.friendDetails'
        type: array
      next_cursor:
        type: string
    type: object
  me.locationDetails:
    properties:
      accuracy:
        type: number
      altitude:
        type: number
      bearing:
        type: number
      last_update:
        description: LastUpdate is the location fix time in Unix milliseconds (UTC).
        format: int64
        type: integer
      latitude:
        type: number
      longitude:
        type: number
      speed:
        type: number
    required:
    - last_update
    type: object
  me.pausedFriendDetails:
    properties:
      username:
        type: string
    type: object
  me.updateLocationRequest:
    properties:
      accuracy:
        type: number
      altitude:
        type: number
      bearing:
        type: number
      last_update:
        description: LastUpdate is the location fix time in Unix milliseconds (UTC).
        format: int64
        type: integer
      latitude:
        type: number
      longitude:
        type: number
      speed:
        type: number
    required:
    - last_update
    type: object
  me.updateStatusRequest:
    properties:
      status:
        description: Status is at most 1024 characters; an empty string clears the
          status.
        maxLength: 1024
        type: string
    type: object
info:
  contact: {}
  description: 'Request bodies: max 16 KiB (413); JSON bodies require application/json
    (415).'
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: WhereIsEveryone
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: invalid usernames and passwords return the same 403 response after
        bcrypt verification
      parameters:
      - description: login details
        in: body
        name: userDetails
        required: true
        schema:
          $ref: '#/definitions/auth.logInRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.authResponse'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "403":
          description: forbidden (invalid credentials)
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "409":
          description: device token conflict; session revoked, log in again
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: request body exceeds 16 KiB
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: content type must be application/json
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "429":
          description: too many requests; see Retry-After
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: log in
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: atomically consumes the current refresh-purpose token for the bound
        device; refresh reuse is rejected immediately; the previous access token remains
        valid for up to 120 seconds, subject to its expiration
      parameters:
      - description: refresh token
        in: body
        name: refresh
        required: true
        schema:
          $ref: '#/definitions/auth.refreshTokenRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.authResponse'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: expired refresh token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "403":
          description: invalid refresh token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "404":
          description: user not exists
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "409":
          description: device token conflict; session revoked, log in again
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: request body exceeds 16 KiB
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: content type must be application/json
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: refresh auth tokens
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: creates a new user
      parameters:
      - description: sign up details
        in: body
        name: userDetails
        required: true
        schema:
          $ref: '#/definitions/auth.signUpRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.authResponse'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "409":
          description: conflict (user with such a name exists)
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "413":
          description: request body exceeds 16 KiB
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: content type must be application/json
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "429":
          description: too many requests; see Retry-After
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: sign up as a new user
      tags:
      - auth
  /me/friend:
    delete:
      consumes:
      - application/json
      description: removes friend and clears pending requests between users
      parameters:
      - description: user to unfriend
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/me.friendRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "404":
          description: requested user not exists
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "413":
          description: request body exceeds 16 KiB
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: content type must be application/json
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: remove friend
      tags:
      - me
    post:
      consumes:
      - application/json
      description: sends friend request to another user
      parameters:
      - description: user to friend
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/me.friendRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "404":
          description: requested user not exists
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "409":
          description: friend or pending request limit reached
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "413":
          description: request body exceeds 16 KiB
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: content type must be application/json
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: send friend request
      tags:
      - me
  /me/friend/accept:
    post:
      consumes:
      - application/json
      description: accepts pending friend request from another user
      parameters:
      - description: user to accept
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/me.friendRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/me.friendDetails'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "404":
          description: requested user not exists
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "409":
          description: friend or pending request limit reached
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "413":
          description: request body exceeds 16 KiB
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: content type must be application/json
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: accept friend request
      tags:
      - me
  /me/friend/reject:
    post:
      consumes:
      - application/json
      description: rejects pending friend request from another user
      parameters:
      - description: user to reject
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/me.friendRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "404":
          description: requested user not exists
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "413":
          description: request body exceeds 16 KiB
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: content type must be application/json
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: reject friend request
      tags:
      - me
  /me/friends:
    get:
      description: One bounded relationship page. Pending entries omit status and
        location.
      parameters:
      - default: accepted
        description: list
        enum:
        - accepted
        - pending_incoming
        - pending_outgoing
        in: query
        name: state
        type: string
      - default: 50
        description: page size
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: opaque next_cursor from the preceding page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/me.getFriendsResponse'
        "400":
          description: invalid pagination parameters
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: get friends details
      tags:
      - me
  /me/location:
    delete:
      description: nullify logged user location
      responses:
        "204":
          description: No Content
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: wipe location
      tags:
      - me
    put:
      consumes:
      - application/json
      description: 'Unix-ms fix time: max age 24h, future skew 5m (capped); older/duplicate
        fixes ignored.'
      parameters:
      - description: update location object
        in: body
        name: location
        required: true
        schema:
          $ref: '#/definitions/me.updateLocationRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "413":
          description: request body exceeds 16 KiB
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: content type must be application/json
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: update location
      tags:
      - me
  /me/sharing:
    get:
      description: returns list of friends with whom location sharing is paused
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/me.pausedFriendDetails'
            type: array
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: get paused friends details
      tags:
      - me
  /me/sharing/resume:
    post:
      consumes:
      - application/json
      description: resume sharing location with another user
      parameters:
      - description: user to resume sharing with
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/me.friendRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "413":
          description: request body exceeds 16 KiB
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: content type must be application/json
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: resume sharing location
      tags:
      - me
  /me/sharing/stop:
    post:
      consumes:
      - application/json
      description: stop sharing location with another user
      parameters:
      - description: user to stop sharing with
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/me.friendRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "413":
          description: request body exceeds 16 KiB
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: content type must be application/json
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: stop sharing location
      tags:
      - me
  /me/status:
    put:
      consumes:
      - application/json
      description: updates logged user status (text status)
      parameters:
      - description: update status object
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/me.updateStatusRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "413":
          description: request body exceeds 16 KiB
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "415":
          description: content type must be application/json
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/jsonerr.JSONError'
      summary: update status
      tags:
      - me
securityDefinitions:
  Bearer:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
